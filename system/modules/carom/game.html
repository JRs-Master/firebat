<script>
/* ── physics.js ─────────────────────────────────────────── */
/**
 * carom-physics.js — headless, deterministic carom billiards core.
 *
 * Why this is hand-written instead of cannon-es / rapier: a generic rigid-body engine
 * approximates sphere-sphere friction, so it loses *throw* (the cut angle shifting when you
 * hit thin) and it models the cushion as a plane through the ball's equator, so side spin
 * does not change the rebound angle. Those two are exactly what a carom player feels. Here
 * both fall out of the model instead of being special-cased.
 *
 * Deterministic by construction: fixed timestep, no RNG, no wall clock. The same shot gives
 * the same table every time — which is what makes replays, tests, and the AI search (which
 * runs thousands of these per turn) possible at all.
 *
 * Units: metres, seconds, radians. Every ball has mass 1, so an impulse IS a velocity delta.
 * Frame: the cloth is the XY plane with the origin at a corner and z up. A ball centre rides
 * at height R, so cloth contact is at -R z while the cushion nose is ABOVE the centre — that
 * offset is the entire reason english works.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CaromPhysics = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var G = 9.81;

  /** Playing surface in metres. Carom tables have no pockets. */
  var TABLES = {
    large: { w: 2.84, h: 1.42 },   // international, three-cushion
    medium: { w: 2.54, h: 1.27 },  // the size Korean four-ball is usually played on
  };

  var DEFAULTS = {
    R: 0.03075,          // carom ball radius (61.5 mm across)
    muSlide: 0.20,       // cloth, while the contact patch is still skidding
    muRoll: 0.010,       // rolling resistance once it grips
    muSpin: 0.044,       // decay of spin about the vertical axis
    eBall: 0.94,         // ball to ball restitution
    muBall: 0.06,        // ball to ball friction — this is what produces throw
    eCushion: 0.80,      // ball to cushion restitution
    muCushion: 0.20,     // ball to cushion friction — this is what makes english bite
    noseHeight: 1.27,    // cushion nose height in units of R (0.635 x diameter, the standard)
    stopV: 0.004,        // m/s under which a ball is parked
    stopW: 0.40,         // rad/s
    dt: 1 / 240,
    maxTime: 25,
    maxTipOffset: 0.5,   // how far from centre the tip may sit, in R, before it miscues
  };

  function len(x, y) { return Math.sqrt(x * x + y * y); }

  /**
   * Velocity of the cloth contact patch. Zero means the ball has stopped skidding and is
   * rolling; every phase decision below keys off this one quantity.
   */
  function contactVel(b, R) {
    return [b.v[0] - R * b.w[1], b.v[1] + R * b.w[0]];
  }

  /** Force the spin that pure rolling implies, so the roll phase stays self-consistent. */
  function snapRoll(b, R) {
    b.w[1] = b.v[0] / R;
    b.w[0] = -b.v[1] / R;
  }

  function integrateRoll(b, k, dt) {
    var s = len(b.v[0], b.v[1]);
    if (s < 1e-9) { b.v[0] = 0; b.v[1] = 0; return; }
    var dec = k.muRoll * G;
    var h = Math.min(dt, s / dec);
    var ux = b.v[0] / s, uy = b.v[1] / s;
    b.p[0] += b.v[0] * h - 0.5 * dec * ux * h * h;
    b.p[1] += b.v[1] * h - 0.5 * dec * uy * h * h;
    b.v[0] -= dec * ux * h;
    b.v[1] -= dec * uy * h;
    snapRoll(b, k.R);
  }

  /**
   * Advance one ball against the cloth for dt.
   *
   * Sliding has a closed form: the contact-patch velocity keeps its direction and shrinks
   * linearly at (7/2)*mu*g, so the moment it becomes a roll is found exactly rather than
   * stumbled past. Vertical spin decays on its own clock — that is why english is still
   * alive when the ball reaches the cushion, and why a ball can sit still and keep spinning.
   */
  function integrateCloth(b, k, dt) {
    var R = k.R;
    var u = contactVel(b, R);
    var us = len(u[0], u[1]);

    if (us > 1e-7) {
      var ux = u[0] / us, uy = u[1] / us;
      var tSlide = 2 * us / (7 * k.muSlide * G);
      var h = Math.min(dt, tSlide);
      var a = k.muSlide * G;
      b.p[0] += b.v[0] * h - 0.5 * a * ux * h * h;
      b.p[1] += b.v[1] * h - 0.5 * a * uy * h * h;
      b.v[0] -= a * ux * h;
      b.v[1] -= a * uy * h;
      var aw = (5 * a) / (2 * R);
      b.w[0] += aw * (-uy) * h;
      b.w[1] += aw * (ux) * h;
      if (h < dt) { snapRoll(b, R); integrateRoll(b, k, dt - h); }
    } else {
      snapRoll(b, R);
      integrateRoll(b, k, dt);
    }

    var az = (5 * k.muSpin * G) / (2 * R) * dt;
    if (Math.abs(b.w[2]) <= az) b.w[2] = 0;
    else b.w[2] -= (b.w[2] > 0 ? 1 : -1) * az;
  }

  function isStopped(b, k) {
    return len(b.v[0], b.v[1]) < k.stopV && Math.abs(b.w[2]) < k.stopW;
  }

  /**
   * Ball on ball. The normal part is ordinary restitution; the tangential part is where
   * carom lives. Relative surface speed along the tangent picks up R*wz from BOTH balls (a
   * vertical-axis spin shows up at the contact point as purely tangential motion), and the
   * Coulomb-capped impulse opposing it is throw and spin transfer in a single term.
   */
  function collideBalls(a, b, k) {
    var nx = b.p[0] - a.p[0], ny = b.p[1] - a.p[1];
    var d = len(nx, ny) || 1e-9;
    var ux = nx / d, uy = ny / d;
    var tx = -uy, ty = ux;

    var vn = (b.v[0] - a.v[0]) * ux + (b.v[1] - a.v[1]) * uy;
    if (vn >= 0) return 0;

    var jn = -(1 + k.eBall) * vn / 2;

    var st = (b.v[0] - a.v[0]) * tx + (b.v[1] - a.v[1]) * ty - k.R * (a.w[2] + b.w[2]);
    var jt = -st / 7;
    var cap = k.muBall * jn;
    if (jt > cap) jt = cap; else if (jt < -cap) jt = -cap;

    var jx = jn * ux + jt * tx, jy = jn * uy + jt * ty;
    a.v[0] -= jx; a.v[1] -= jy;
    b.v[0] += jx; b.v[1] += jy;

    // An in-plane impulse on the equator can only twist a ball about the vertical axis.
    var dwz = -5 * jt / (2 * k.R);
    a.w[2] += dwz; b.w[2] += dwz;
    return -vn;   // closing speed — the renderer scales the click with it
  }

  /**
   * Ball on cushion. The nose sits 0.27R ABOVE the centre, so the impulse has a vertical
   * lever arm: the normal part trades follow/draw against rebound speed, and the tangential
   * part turns wz into a change of angle. Put the nose at the equator instead and english
   * becomes cosmetic — the usual tell of a generic engine.
   */
  function collideCushion(b, k, nx, ny) {
    var vn = b.v[0] * nx + b.v[1] * ny;
    if (vn >= 0) return 0;
    var tx = -ny, ty = nx;

    var cz = (k.noseHeight - 1) * k.R;
    var horiz = Math.sqrt(Math.max(0, k.R * k.R - cz * cz));
    var cx = -nx * horiz, cy = -ny * horiz;

    var jn = -(1 + k.eCushion) * vn;

    // surface velocity at the contact point = v + w x c, projected on the tangent
    var sx = b.v[0] + (b.w[1] * 0 - b.w[2] * cy);
    var sy = b.v[1] + (b.w[2] * cx - b.w[0] * 0);
    var st = sx * tx + sy * ty;
    var jt = -(2 / 7) * st;
    var cap = k.muCushion * jn;
    if (jt > cap) jt = cap; else if (jt < -cap) jt = -cap;

    var jx = jn * nx + jt * tx, jy = jn * ny + jt * ty;
    b.v[0] += jx; b.v[1] += jy;

    var iw = 5 / (2 * k.R * k.R);
    b.w[0] += iw * (-cz * jy);
    b.w[1] += iw * (cz * jx);
    b.w[2] += iw * (cx * jy - cy * jx);
    return -vn;
  }

  /**
   * balls: [{ id, p:[x,y] }] — everything starts at rest.
   * Rails are named so the rule layer can count cushions without knowing any geometry.
   */
  function createWorld(opts) {
    opts = opts || {};
    var k = {};
    for (var key in DEFAULTS) k[key] = DEFAULTS[key];
    if (opts.constants) for (var c in opts.constants) k[c] = opts.constants[c];
    var table = opts.table || TABLES.large;

    return {
      k: k,
      table: { w: table.w, h: table.h },
      balls: (opts.balls || []).map(function (b) {
        return { id: b.id, p: [b.p[0], b.p[1]], v: [0, 0], w: [0, 0, 0] };
      }),
    };
  }

  function ballIndex(world, id) {
    for (var i = 0; i < world.balls.length; i++) if (world.balls[i].id === id) return i;
    return -1;
  }

  function ball(world, id) {
    var i = ballIndex(world, id);
    return i < 0 ? null : world.balls[i];
  }

  /**
   * Put a cue impulse on one ball.
   *
   * side and vert are the tip's offset from centre as a fraction of R: side > 0 is right
   * english, vert > 0 is follow. Past maxTipOffset the tip would slide off the ball, so this
   * reports a miscue rather than quietly delivering spin no cue could produce.
   */
  function shoot(world, ballId, shot) {
    var k = world.k, R = k.R;
    var b = ball(world, ballId);
    if (!b) throw new Error('unknown ball: ' + ballId);

    var a = shot.side || 0, h = shot.vert || 0;
    var off = len(a, h);
    if (off > k.maxTipOffset) return { miscue: true, offset: off };

    var dx = Math.cos(shot.angle), dy = Math.sin(shot.angle);
    var v0 = shot.speed;
    b.v[0] = dx * v0; b.v[1] = dy * v0;

    // t is the horizontal axis to the left of the aim line. The tip offset twists the ball
    // about it (follow/draw) and about the vertical axis (english).
    var tx = -dy, ty = dx;
    var g = (5 * v0) / (2 * R);
    b.w[0] = g * h * tx;
    b.w[1] = g * h * ty;
    b.w[2] = -g * a;
    return { miscue: false };
  }

  /**
   * Run until every ball is at rest (or maxTime). Returns the ordered contact log — the rule
   * layer reads only this, so four-ball and three-cushion share one simulator.
   *
   * trace: optional per-step sampler for the renderer or for debugging.
   */
  function rails(world) {
    var R = world.k.R, W = world.table.w, H = world.table.h;
    return [
      { n: [1, 0], name: 'left', axis: 0, at: R, sign: 1 },
      { n: [-1, 0], name: 'right', axis: 0, at: W - R, sign: -1 },
      { n: [0, 1], name: 'bottom', axis: 1, at: R, sign: 1 },
      { n: [0, -1], name: 'top', axis: 1, at: H - R, sign: -1 },
    ];
  }

  function anyMoving(world) {
    for (var i = 0; i < world.balls.length; i++) {
      if (!isStopped(world.balls[i], world.k)) return true;
    }
    return false;
  }

  /**
   * One integration + collision pass. simulate() is a loop over this, and the renderer and
   * the tests drive it directly — so there is exactly one place where a step is defined.
   * Returns the contacts that happened during this step (t is relative, callers add their own).
   */
  function step(world, dt, out) {
    var k = world.k, R = k.R, bs = world.balls;
    var hits = out || [];

    for (var m = 0; m < bs.length; m++) {
      if (isStopped(bs[m], k)) { bs[m].v[0] = 0; bs[m].v[1] = 0; }
      else integrateCloth(bs[m], k, dt);
    }

    // Resolve after integrating. At 240 Hz a ball covers about 2 cm per step against a 6 cm
    // diameter, so overlap-then-separate is stable; positions are pushed apart before the
    // impulse so a deep overlap cannot latch two balls together.
    var rs = rails(world);
    for (var r = 0; r < rs.length; r++) {
      var ra = rs[r];
      for (var q = 0; q < bs.length; q++) {
        var bb = bs[q];
        var over = ra.sign > 0 ? (ra.at - bb.p[ra.axis]) : (bb.p[ra.axis] - ra.at);
        if (over > 0) {
          bb.p[ra.axis] += ra.sign * over;
          var sp = collideCushion(bb, k, ra.n[0], ra.n[1]);
          if (sp) hits.push({ type: 'cushion', ball: bb.id, rail: ra.name, speed: sp });
        }
      }
    }

      // survival first, then the clean-shot value as the tiebreak
      var robust = lived / probes + c.v / 100000;
      if (robust > bestRobust) { bestRobust = robust; best = c; }
    }

    // ── the hands. Noise is applied to the chosen shot, never to the search: a weak player is
    //    not someone who imagines a bad shot, it is someone who cannot deliver a good one.
    var play = {
      angle: best.shot.angle + gauss(rand) * L.angle,
      speed: Math.min(MAXV, Math.max(0.35, best.shot.speed * (1 + gauss(rand) * L.speed))),
      side: best.shot.side + gauss(rand) * L.tip,
      vert: best.shot.vert + gauss(rand) * L.tip,
    };
    var off = Math.hypot(play.side, play.vert);
    if (off > P.DEFAULTS.maxTipOffset) {
      play.side *= P.DEFAULTS.maxTipOffset / off;
      play.vert *= P.DEFAULTS.maxTipOffset / off;
    }

    return {
      play: play,
      intent: best.shot,
      expect: best.score,               // what it believed the intended shot would do
      margin: Math.max(0, bestRobust),  // how often that belief survived its own shaky hands
      looked: used,
      level: levelName,
    };
  }

  return { LEVELS: LEVELS, levelLabel: levelLabel, plan: plan, MAXV: MAXV, value: value };
});

  tg.strokeStyle = 'rgba(255,255,255,.20)'; tg.lineWidth = 2; tg.stroke();
  tg.strokeStyle = 'rgba(0,0,0,.20)'; tg.lineWidth = 1.5;
  tg.beginPath(); tg.arc(c, c, rad * P.DEFAULTS.maxTipOffset * 2, 0, Math.PI * 2); tg.stroke();
  tg.strokeStyle = 'rgba(0,0,0,.12)';
  tg.beginPath(); tg.moveTo(c - rad, c); tg.lineTo(c + rad, c);
  tg.moveTo(c, c - rad); tg.lineTo(c, c + rad); tg.stroke();
  tg.fillStyle = '#1d4ed8';
  tg.beginPath(); tg.arc(c + shot.side * rad, c - shot.vert * rad, 8.5, 0, Math.PI * 2); tg.fill();
  tg.strokeStyle = 'rgba(255,255,255,.9)'; tg.lineWidth = 2; tg.stroke();
}
function setTip(e) {
  const r = tipC.getBoundingClientRect();
  let dx = (e.clientX - r.left) / r.width * 2 - 1, dy = 1 - (e.clientY - r.top) / r.height * 2;
  const m = Math.hypot(dx, dy), lim = P.DEFAULTS.maxTipOffset * 2;
  if (m > lim) { dx = dx / m * lim; dy = dy / m * lim; }
  shot.side = dx / 2; shot.vert = dy / 2;
  drawTip(); readout(); needGuide = true;
}
let tipDrag = false;
el('cTip').addEventListener('pointerdown', e => { tipDrag = true; el('cTip').setPointerCapture(e.pointerId); setTip(e); e.stopPropagation(); });
el('cTip').addEventListener('pointermove', e => { if (tipDrag) setTip(e); });
el('cTip').addEventListener('pointerup', () => { tipDrag = false; });

const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function tableHit(e) {
  const r = renderer.domElement.getBoundingClientRect();
  const nd = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1,
                               -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(nd, camera);
  const hit = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, hit) ? hit : null;
}
function aimAt(e) {
  const hit = tableHit(e); if (!hit) return;
  const cb = P.ball(world, HUMAN);
  const ax = hit.x - sx(cb.p[0]), az = hit.z - sz(cb.p[1]);
  if (Math.hypot(ax, az) < R * 1.2) return;
  shot.angle = Math.atan2(-az, ax);
  readout(); needGuide = true;
}

const pointers = new Map();
let aiming = false, pinch = null;
stage.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, e);
  stage.setPointerCapture(e.pointerId);
  if (pointers.size >= 2) { aiming = false; pinch = null; return; }
  if (!canPlay()) return;
  aiming = true; aimAt(e);
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
    if (pinch) {
      cam.dist = Math.min(7, Math.max(1.5, cam.dist * (pinch.d / d)));
      cam.az += (cx - pinch.cx) * 0.005;
      cam.el = Math.min(1.50, Math.max(0.15, cam.el - (cy - pinch.cy) * 0.004));
      placeCamera(); lampVisibility();
    }
    pinch = { d, cx, cy };
    return;
  }
  if (aiming) aimAt(e);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) aiming = false;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('contextmenu', e => e.preventDefault());

function canPlay() {
  return match && !match.over && !playing && !botThinking && Rules.shooterOf(match) === HUMAN;
}

/* ── the gauge: press to start it sweeping, press again to stop where you want it. */
const fire = el('cFire');
function gaugeTick(now) {
  if (!gauge.running) return;
  const ph = ((now - gauge.t0) % GAUGE_PERIOD) / GAUGE_PERIOD;
  const v = ph < 0.5 ? ph * 2 : (1 - ph) * 2;           // up then back down
  gauge.value = 0.06 + v * 0.94;
  el('cGaugeFill').style.width = (gauge.value * 100) + '%';
  el('cGaugeLbl').textContent = Math.round(gauge.value * 100) + '%';
}
function startGauge() {
  gauge.running = true; gauge.t0 = performance.now();
  el('cGaugeMark').style.opacity = 0;
  fire.classList.add('armed'); fire.textContent = '멈춤';
  el('cHint').textContent = '원하는 세기에서 다시 누르면 칩니다';
}
function stopGaugeAndFire() {
  gauge.running = false;
  fire.classList.remove('armed'); fire.textContent = '치기';
  el('cGaugeMark').style.left = (gauge.value * 100) + '%';
  el('cGaugeMark').style.opacity = 0.9;
  el('cHint').textContent = '';
  playShot(HUMAN, { angle: shot.angle, speed: gauge.value * MAXV, side: shot.side, vert: shot.vert });
}
fire.addEventListener('click', () => {
  if (!canPlay()) return;
  audio();
  if (gauge.running) stopGaugeAndFire(); else startGauge();
});
addEventListener('keydown', e => {
  if (e.code !== 'Space' || !canPlay()) return;
  e.preventDefault(); audio();
  if (gauge.running) stopGaugeAndFire(); else startGauge();
});

/* ══ playing a shot ═════════════════════════════════════════════════════════
   Simulated to completion the instant it is struck, then replayed. The outcome is settled
   before the first frame is drawn, so the score can never disagree with the animation — and
   the same property is what lets the server re-derive a submitted score from the shot log.
   ═════════════════════════════════════════════════════════════════════════ */
let playing = null, botThinking = false;

function playShot(who, sh) {
  const probe = P.createWorld({ table: TABLE, balls: world.balls.map(b => ({ id: b.id, p: b.p.slice() })) });
  const m = P.shoot(probe, who, sh);
  if (m.miscue) { el('cLog').textContent = '미스큐 — 당점이 공을 벗어났습니다'; return; }
  const res = P.simulate(probe, { trace: true, traceEvery: 4 });
  audio();
  for (const e of res.events) clack(e.t, e.speed || 1, e.type);
  shotLog.push({ who, ...sh });
  playing = { res, finalP: probe.balls.map(b => [b.p[0], b.p[1]]), t0: performance.now(), i: 0 };
  guideLine.visible = false; ghost.visible = false; cueGroup.visible = false;
  fire.disabled = true;
  el('cLog').textContent = '';
}

function advancePlayback() {
  const pb = playing, tr = pb.res.trace;
  const t = (performance.now() - pb.t0) / 1000;
  while (pb.i < tr.length - 1 && tr[pb.i + 1][0] <= t) pb.i++;
  const f = tr[pb.i], g = tr[Math.min(pb.i + 1, tr.length - 1)];
  const span = Math.max(1e-6, g[0] - f[0]);
  const k = Math.min(1, Math.max(0, (t - f[0]) / span));
  world.balls.forEach((b, i) => {
    const o = 1 + i * 4;
    b.p[0] = f[o] + (g[o] - f[o]) * k;
    b.p[1] = f[o + 1] + (g[o + 1] - f[o + 1]) * k;
  });
  if (!tr.length || t >= tr[tr.length - 1][0]) {
    world.balls.forEach((b, i) => { b.p[0] = pb.finalP[i][0]; b.p[1] = pb.finalP[i][1]; });
    const events = pb.res.events;
    playing = null; fire.disabled = false;
    settleShot(events);
  }
}

function settleShot(events) {
  const who = Rules.shooterOf(match);
  const s = Rules.score(match.game, who, events);
  Rules.applyShot(match, events);
  chime(s.points > 0);
  announce(s, who);
  el('cLog').textContent = verdict(s, who);
  paintScore();
  needGuide = true;
  if (match.over) return finishMatch();
  if (Rules.shooterOf(match) === BOT) setTimeout(botTurn, 700);
}

/** Say what happened in the words a player would use — the contact list is for debugging. */
function verdict(s, who) {
  const me = who === HUMAN, sub = me ? '' : '상대 ';
  if (s.points > 0) {
    return sub + '득점' + (match.game === 'three' ? ` · 쿠션 ${s.cushionsBeforeSecond}개` : '');
  }
  if (s.points < 0) return sub + '벌점 — 상대 공을 맞혔습니다';
  if (s.reason === 'miss_nothing') return sub + '헛쳤습니다';
  if (s.reason === 'miss_one_ball') return sub + `적구를 ${s.shortBy}개 덜 맞혔습니다`;
  if (s.reason === 'not_enough_cushions') return sub + `쿠션이 ${s.shortBy}개 모자랍니다 (${s.cushionsBeforeSecond}개)`;
  return sub + '실패';
}

function announce(s, who) {
  const t = el('cTurn');
  const mine = who === HUMAN;
  t.textContent = s.points > 0 ? (mine ? '득점!' : '상대 득점')
    : s.points < 0 ? (mine ? '벌점' : '상대 벌점')
    : (mine ? '실패' : '상대 실패');
  t.style.color = s.points > 0 ? (mine ? '#6ee7a8' : '#ffb84d') : '#c9d3dd';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 900);
}

function paintScore() {
  const me = match.scores[HUMAN], op = match.scores[BOT];
  const turn = Rules.shooterOf(match);
  el('cSc').innerHTML = `<b class="me${turn === HUMAN ? ' on' : ''}">${me}</b> : ` +
                        `<b class="op${turn === BOT ? ' on' : ''}">${op}</b>`;
  el('cInfo').textContent = `${match.game === 'three' ? '3쿠션' : '4구'} · ${match.target}점 · ` +
    `${match.inning}이닝 · ${AI.levelLabel(cfg.level, cfg.game)}`;
}

/* ── the opponent, in a worker so a three-thousand-shot search does not freeze the table */
let worker = null;
function ensureWorker() {
  if (worker) return worker;
  const src = document.getElementById('caromEngineSrc');
  if (!src) return null;
  const glue = `self.onmessage=function(e){var d=e.data;` +
    `var w=CaromPhysics.createWorld({table:d.table,balls:d.balls});` +
    `self.postMessage(CaromAI.plan(w,d.game,d.shooter,d.level,d.seed));};`;
  try {
    const url = URL.createObjectURL(new Blob([src.textContent + '\n' + glue], { type: 'text/javascript' }));
    worker = new Worker(url);
    return worker;
  } catch { return null; }
}

function botTurn() {
  if (!match || match.over) return;
  botThinking = true;
  cueGroup.visible = false; guideLine.visible = false; ghost.visible = false;
  el('cLog').textContent = '상대가 생각 중…';
  const payload = { table: TABLE, balls: world.balls.map(b => ({ id: b.id, p: b.p.slice() })),
                    game: match.game, shooter: BOT, level: cfg.level, seed: (Math.random() * 1e9) | 0 };
  const w = ensureWorker();
  const done = (pick) => {
    botThinking = false;
    el('cLog').textContent = `상대: 후보 ${pick.looked}개 검토`;
    playShot(BOT, pick.play);
  };
  if (w) {
    w.onmessage = (e) => done(e.data);
    w.onerror = () => { botThinking = false; done(AI.plan(world, match.game, BOT, cfg.level)); };
    w.postMessage(payload);
  } else {
    // no worker (rare, and file:// blocks blob workers in some builds) — think on the main
    // thread, which stutters but never leaves the game stuck on the opponent's turn
    setTimeout(() => done(AI.plan(world, match.game, BOT, cfg.level)), 30);
  }
}

/* ══ match lifecycle ════════════════════════════════════════════════════════ */
function startMatch() {
  spec = layout(cfg.game);
  world = P.createWorld({ table: TABLE, balls: spec.map(b => ({ id: b.id, p: b.p.slice() })) });
  startLayout = spec.map(b => ({ id: b.id, p: b.p.slice() }));
  shotLog = [];
  match = Rules.newMatch(cfg.game, cfg.target,
    [{ id: HUMAN, name: '나' }, { id: BOT, name: AI.levelLabel(cfg.level, cfg.game) }]);
  buildBalls(); syncView(); paintScore(); readout(); drawTip();
  gauge.running = false; gauge.value = 0.35;
  el('cGaugeFill').style.width = '35%'; el('cGaugeLbl').textContent = '힘';
  el('cGaugeMark').style.opacity = 0;
  fire.textContent = '치기'; fire.classList.remove('armed'); fire.disabled = false;
  el('cLog').textContent = '';
  el('cHint').textContent = '테이블을 끌어서 조준 · [치기] 로 세기 게이지 시작';
  needGuide = true;
}

function finishMatch() {
  const won = match.winner === HUMAN;
  el('cOverT').textContent = won ? '이겼습니다' : '졌습니다';
  el('cOverP').textContent =
    `${match.game === 'three' ? '3쿠션' : '4구'} ${match.target}점 · ${AI.levelLabel(cfg.level, cfg.game)} 상대 · ` +
    `${match.inning}이닝 · 하이런 ${match.best[HUMAN]}점 · 최종 ${match.scores[HUMAN]}:${match.scores[BOT]}`;
  el('cSubmit').style.display = won ? '' : 'none';
  el('cOver').classList.add('show');
}

/* ══ ranking ════════════════════════════════════════════════════════════════
   Anyone can POST a number, so the score is submitted WITH the shot log and the opening
   layout, and the module replays it through this same physics to see whether the claimed
   result actually falls out. One engine file, two readers — the page cannot beat the server
   because they are running the same code.
   ═════════════════════════════════════════════════════════════════════════ */
const SLUG = (location.pathname.split('/').filter(Boolean).pop() || 'carom');
async function callModule(action, data) {
  const res = await fetch('/api/page-form', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: SLUG, module: 'carom', data: { action, ...data } }),
  });
  return res.json();
}
async function loadRanking() {
  const box = el('cRankL');
  box.innerHTML = '<div style="color:#7c8894">불러오는 중…</div>';
  try {
    const r = await callModule('top_scores', { game: cfg.game, limit: 20 });
    const rows = (r && r.data && r.data.scores) || [];
    box.innerHTML = rows.length ? rows.map((s, i) =>
      `<div><i>${i + 1}</i><span>${escapeHtml(s.name)}</span>` +
      `<em>${s.innings}이닝 · 하이런 ${s.high} · ${s.level}</em></div>`).join('')
      : '<div style="color:#7c8894">아직 기록이 없습니다</div>';
  } catch {
    box.innerHTML = '<div style="color:#7c8894">랭킹은 발행된 페이지에서만 동작합니다</div>';
  }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

el('cSubmit').addEventListener('click', async () => {
  const name = (el('cWho').value || '').trim().slice(0, 12) || '익명';
  el('cSubmit').disabled = true; el('cSubmit').textContent = '등록 중…';
  try {
    const r = await callModule('submit_score', {
      name, game: match.game, target: match.target, level: cfg.level,
      innings: match.inning, high: match.best[HUMAN],
      layout: startLayout, shots: shotLog,
    });
    el('cSubmit').textContent = (r && r.success) ? '등록 완료' : ((r && r.error) || '등록 실패');
  } catch {
    el('cSubmit').textContent = '발행 페이지에서만 등록됩니다';
  }
});
el('cAgain').addEventListener('click', () => { el('cOver').classList.remove('show'); el('cSetup').classList.add('show'); });
el('cOpenRank').addEventListener('click', () => { el('cRankV').classList.add('show'); loadRanking(); });
el('cRankClose').addEventListener('click', () => el('cRankV').classList.remove('show'));

/* ══ setup screen ═══════════════════════════════════════════════════════════ */
function optionRow(id, key, values) {
  const box = el(id);
  if (values) box.innerHTML = values.map(v => `<div class="cOpt" data-v="${v}">${v}점</div>`).join('');
  box.addEventListener('click', e => {
    const o = e.target.closest('.cOpt'); if (!o) return;
    [...box.children].forEach(c => c.classList.toggle('sel', c === o));
    const v = o.dataset.v;
    cfg[key] = key === 'target' ? parseInt(v, 10) : v;
    if (key === 'game') syncTargets();
  });
}
function syncTargets() {
  const vals = cfg.game === 'three' ? [5, 10, 15, 20] : [10, 20, 30, 50];
  el('cOptTarget').innerHTML = vals.map(v =>
    `<div class="cOpt${v === vals[1] ? ' sel' : ''}" data-v="${v}">${v}점</div>`).join('');
  cfg.target = vals[1];
  // The opponent's rating is quoted in the units of the game being played, so it has to be
  // rebuilt whenever the game changes.
  el('cOptLevel').innerHTML = ['beginner', 'club', 'strong', 'pro'].map(k =>
    `<div class="cOpt${k === cfg.level ? ' sel' : ''}" data-v="${k}">${AI.levelLabel(k, cfg.game)}</div>`).join('');
}
optionRow('cOptGame', 'game');
optionRow('cOptTarget', 'target');
optionRow('cOptLevel', 'level');
syncTargets();

el('cStart').addEventListener('click', () => { audio(); el('cSetup').classList.remove('show'); startMatch(); });
el('cMenu').addEventListener('click', () => el('cSetup').classList.add('show'));
el('cView').addEventListener('click', () => {
  cam.top = !cam.top;
  el('cView').textContent = cam.top ? '입체뷰' : '탑뷰';
  el('cView').classList.toggle('on', cam.top);
  if (cam.top) { cam.az = root.clientHeight > root.clientWidth ? Math.PI : -Math.PI / 2; cam.el = 1.50; }
  else resize();
  fitCamera();
});
el('cRotateOk').addEventListener('click', () => { rotateDismissed = true; el('cRotate').classList.remove('show'); });

/* ══ boot ═══════════════════════════════════════════════════════════════════ */
spec = layout(cfg.game);
world = P.createWorld({ table: TABLE, balls: spec.map(b => ({ id: b.id, p: b.p.slice() })) });
buildBalls(); resize(); readout(); drawTip(); syncView();

window.__carom = { P, Rules, AI, cam, camera, scene, renderer, cfg, FIT, fitCamera, resize,
  get world() { return world; }, get match() { return match; }, get shot() { return shot; },
  get gauge() { return gauge; }, get busy() { return !!playing || botThinking; },
  startMatch, playShot, botTurn,
  // the probe moves balls directly, which no interaction did, so it needs a way to ask for a
  // fresh guide — without it the check reads the previous frame's line and passes for nothing
  refreshGuide() { needGuide = true; } };

renderer.setAnimationLoop((now) => {
  gaugeTick(now);
  if (playing) advancePlayback();
  else if (needGuide) buildGuide();
  syncView();
  renderer.render(scene, camera);
});
</script>
</div>
