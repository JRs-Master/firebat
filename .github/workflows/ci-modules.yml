# System modules — the half of the codebase CI never looked at.
#
# Modules deploy by `git pull` on the server, so nothing stands between a commit and a live
# trading cycle. Nothing checked them either: not a syntax check, not the 200-odd self-test
# assertions the trading module already carries and only ran when somebody remembered to ask.
# A shebang in the wrong place would have shipped, and the Rust workflow would have stayed green
# because its path filter never mentions `system/`.
#
# Cheap on purpose — no network, no credentials, seconds to run. A module that needs a key to be
# tested is tested against the venue by hand; this catches the class that does not need one.
name: CI Modules

on:
  push:
    branches: [main]
    paths:
      - 'system/**'
      - 'package-lock.json'
      - '.github/workflows/ci-modules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'system/**'
      - 'package-lock.json'
      - '.github/workflows/ci-modules.yml'

jobs:
  modules:
    name: Modules (syntax + selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Every entry point parses. `node --check` and `compileall` are not deep, but they are the
      # difference between "the module is broken" and "the module is broken in production".
      - name: JavaScript syntax
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax"; fail=1; }
          done < <(find system -name '*.mjs' -o -name '*.cjs' -o -name '*.js')
          exit $fail

      - name: Python syntax
        run: python -m compileall -q system

      # A module whose config.json does not parse registers nothing, and the only symptom is that
      # it silently is not there.
      - name: config.json parses
        run: |
          fail=0
          for f in system/modules/*/config.json; do
            python -c "import json,sys;json.load(open(sys.argv[1],encoding='utf-8'))" "$f" \
              || { echo "::error file=$f::not valid JSON"; fail=1; }
          done
          exit $fail

      # A config can parse and still be a schema the validator refuses: a property written as its
      # description string instead of {type, description}. The framework then rejects EVERY call to
      # the module before it runs ("schema itself malformed"), and nothing else notices — motion's
      # `font` sat like that from 2026-09-09 to 10-02. Every place a schema is expected must hold one.
      - name: input and output schemas are schemas
        run: |
          python - <<'EOF'
          import glob, json, sys

          def bad(node, path):
              out = []
              if not isinstance(node, dict):
                  return out
              for key in ("properties", "patternProperties", "definitions", "$defs"):
                  for name, child in (node.get(key) or {}).items():
                      if isinstance(child, (dict, bool)):
                          out += bad(child, f"{path}.{key}.{name}")
                      else:
                          out.append(f"{path}.{key}.{name} is a {type(child).__name__}, not a schema")
              for key in ("items", "additionalProperties", "not", "contains"):
                  child = node.get(key)
                  kids = child if (key == "items" and isinstance(child, list)) else ([] if child is None else [child])
                  for i, c in enumerate(kids):
                      where = f"{path}.{key}" + (f"[{i}]" if isinstance(child, list) else "")
                      out += bad(c, where) if isinstance(c, (dict, bool)) else [f"{where} is a {type(c).__name__}, not a schema"]
              for key in ("anyOf", "oneOf", "allOf"):
                  for i, c in enumerate(node.get(key) or []):
                      where = f"{path}.{key}[{i}]"
                      out += bad(c, where) if isinstance(c, (dict, bool)) else [f"{where} is a {type(c).__name__}, not a schema"]
              return out

          fail = 0
          for f in sorted(glob.glob("system/modules/*/config.json")):
              c = json.load(open(f, encoding="utf-8"))
              for section in ("input", "output"):
                  s = c.get(section)
                  if s is None:
                      continue
                  msgs = bad(s, section) if isinstance(s, (dict, bool)) else [f"{section} is a {type(s).__name__}, not a schema"]
                  for m in msgs:
                      print(f"::error file={f}::{m} - the validator would reject every call to this module")
                      fail = 1
          sys.exit(fail)
          EOF

      # The trading module carries its own assertions — ledger invariants, the exit ladder, order
      # keys, the gate. They caught three real defects the night they were written and then went
      # back to running only when asked.
      - name: autotrade selftest
        run: |
          cd system/modules/autotrade
          echo '{"data":{"action":"selftest"}}' | python main.py > /tmp/selftest.json
          python - <<'EOF'
          import json
          d = json.load(open('/tmp/selftest.json', encoding='utf-8'))
          data = d.get('data') or {}
          bad = [c for c in data.get('checks', []) if not c.get('ok')]
          for c in bad:
              print(f"::error::{c['name']} — want {c.get('want')!r}, got {c.get('got')!r}")
          print(f"{data.get('passed')} passed, {len(bad)} failed")
          raise SystemExit(1 if (bad or not d.get('success')) else 0)
          EOF

  # The prelude every Node module runs under (`_runtime/ipv4-prelude.cjs`): a connection that could
  # not be made is made once more, every failed attempt names the phase it stopped in, and
  # `fetch failed` carries its cause. Local sockets only. Node 24 and the undici version the
  # lockfile pins, because that pair is what the server runs — the prelude resolves undici from
  # the root node_modules there, which is why a lockfile change runs this workflow too.
  prelude:
    name: Node prelude (connect retry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: connect retry and failure causes, against local sockets
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/undici'].version")
          npm install --no-save --no-package-lock --prefix /tmp/prelude "undici@$v" > /dev/null
          NODE_PATH=/tmp/prelude/node_modules node system/modules/_runtime/ipv4-prelude.test.cjs
